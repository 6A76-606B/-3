name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Create Capacitor project
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/local-notifications@6 @capacitor-firebase/messaging@6 firebase
          npm i -D @capacitor/assets
          npx cap init "الحضور والغياب" com.attendance.app --web-dir www
          npx cap add android
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/><uses-permission android:name="android.permission.VIBRATE"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/></manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Firebase config (push)
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
            echo "google-services.json copied"
          else
            echo "google-services.json not found: push notifications will be disabled"
          fi

      - name: Build icon files
        run: |
          ICON=$(ls icon.png icon.jpg icon.jpeg IMG-*.jpg 2>/dev/null | head -1 || true)
          if [ -z "$ICON" ]; then
            echo "No icon file found, using the default Capacitor icon"
          else
            sudo apt-get update -y
            sudo apt-get install -y imagemagick
            if command -v magick >/dev/null 2>&1; then IM="magick"; else IM="convert"; fi
            mkdir -p assets
            $IM "$ICON" -resize 1024x1024 -background "#6a1f9a" -gravity center -extent 1024x1024 assets/icon-only.png
            $IM "$ICON" -resize 680x680 -background none -gravity center -extent 1024x1024 assets/icon-foreground.png
            $IM -size 1024x1024 xc:"#6a1f9a" assets/icon-background.png
            $IM -size 2732x2732 xc:"#3c0f5c" \( "$ICON" -resize 900x900 \) -gravity center -composite assets/splash.png
            cp assets/splash.png assets/splash-dark.png
            npx capacitor-assets generate --android
          fi

      - name: Sync and build
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: attendance-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
