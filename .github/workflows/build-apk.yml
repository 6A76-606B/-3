name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Create Capacitor project
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npm i -D @capacitor/assets
          npx cap init "الحضور والغياب" com.attendance.app --web-dir www
          npx cap add android

      - name: Build icon files
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick
          if command -v magick >/dev/null 2>&1; then IM="magick"; else IM="convert"; fi
          mkdir -p assets
          $IM icon.png -resize 1024x1024 -background "#6a1f9a" -gravity center -extent 1024x1024 assets/icon-only.png
          $IM icon.png -resize 680x680 -background none -gravity center -extent 1024x1024 assets/icon-foreground.png
          $IM -size 1024x1024 xc:"#6a1f9a" assets/icon-background.png
          npx capacitor-assets generate --android

      - name: Sync and build
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: attendance-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
