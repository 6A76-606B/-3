body::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(35,6,58,.55),rgba(35,6,58,.78));z-index:-1}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;position:sticky;top:0;background:rgba(35,6,58,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:5}
h1{font-size:1.25rem;letter-spacing:.3px;text-shadow:0 2px 8px rgba(0,0,0,.4)}
button{cursor:pointer;border:0;border-radius:999px;padding:9px 16px;font-size:.95rem;color:#fff;background:var(--p);transition:transform .12s,filter .12s}
button:hover{filter:brightness(1.1)}button:active{transform:scale(.95)}
.adminbtn{background:#fff;color:var(--pd);font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.25)}
main{max-width:640px;margin:0 auto;padding:16px}
.hero{text-align:center;margin:6px 0 16px}
.hero p{opacity:.85;font-size:.9rem}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:16px;padding:10px 14px;margin-bottom:14px}
input{border:0;border-radius:12px;padding:10px 14px;font-size:1rem;width:100%;background:rgba(255,255,255,.95);color:#222;outline:none}
.bar input{width:auto}
.row{display:flex;align-items:center;gap:12px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:18px;padding:11px 14px;margin-bottom:10px;box-shadow:0 4px 16px rgba(0,0,0,.18);animation:up .35s ease both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;background:linear-gradient(135deg,#c084fc,#7b2cbf);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.name{font-weight:700;font-size:1.05rem;flex:1;cursor:pointer;text-shadow:0 1px 4px rgba(0,0,0,.35)}
.name small{display:block;font-weight:400;opacity:.8;font-size:.75rem;margin-top:2px}
.btns{display:flex;gap:6px;align-items:center}
.btns button{background:rgba(255,255,255,.2);color:#fff;padding:8px 14px;border:1px solid var(--line)}
.btns .on.p{background:var(--ok);border-color:var(--ok)}
.btns .on.a{background:var(--no);border-color:var(--no)}
.badge{padding:7px 16px;border-radius:999px;font-size:.92rem;font-weight:700;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.badge.circ{width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;font-size:1.4rem;line-height:1;border-radius:50%}
.badge.n.circ{background:transparent;border:2px solid rgba(255,255,255,.45);box-shadow:none}
.badge.p{background:var(--ok)}.badge.a{background:var(--no)}.badge.n{background:rgba(255,255,255,.25)}
.btns .del{background:rgba(239,68,68,.25)!important;border-color:transparent!important;padding:8px 10px!important}
.add{display:flex;gap:8px;margin-bottom:14px}
.modal{position:fixed;inset:0;background:rgba(15,2,28,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.show{display:flex}
.box{background:linear-gradient(160deg,#4a1470,#2a0a45);border:1px solid var(--line);color:#fff;border-radius:22px;padding:20px;width:100%;max-width:400px;max-height:80vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.box h2{margin-bottom:12px;font-size:1.1rem}
.box li{padding:9px 0;border-bottom:1px solid var(--line);list-style:none}
.box button{margin-top:12px;margin-inline-end:8px}
.err{color:#fca5a5;margin-top:8px;min-height:1.2em}
.note{font-size:.8rem;text-align:center;opacity:.8;margin-top:12px}

html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{padding-bottom:max(40px,env(safe-area-inset-bottom))}
header{padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top))}
main{padding:14px 12px}
input{font-size:16px}
.hero{margin:2px 0 14px}
.hero p{background:rgba(255,255,255,.12);display:inline-block;padding:6px 14px;border-radius:999px;font-size:.82rem}
.row{padding:12px;gap:10px;border-radius:20px}
.btns button{min-height:40px}
.btns .rec,.btns>button:first-child{font-size:.85rem;padding:8px 12px}
.box{border-radius:24px}
.box button{min-height:42px}
.box li{font-size:.95rem;gap:10px}
@media(max-width:480px){
  h1{font-size:1.05rem}
  .adminbtn{padding:8px 12px;font-size:.88rem}
  .name{font-size:1rem}
  .av{width:38px;height:38px;font-size:1rem}
  .row{flex-wrap:wrap}
  .btns.adm{width:100%;justify-content:space-between;margin-top:2px}
  .btns.adm button{flex:1;padding:10px 6px}
  .btns.adm .del{flex:0 0 46px}
  .bar{font-size:.9rem}
  .box{padding:16px}
}
</style>
</head>
<body>
<header>
  <h1>⚜ الحضور والغياب</h1>
  <button class="adminbtn" id="adminBtn">دخول كأدمن</button>
</header>
<main>
  <div class="hero"><p>اضغط على "السجل" لعرض الحضور والغياب لكل شخص</p></div>
  <div class="bar">
    <b id="dayLabel"></b>
    <input type="date" id="date">
  </div>
  <div class="add" id="addBox" hidden>
    <input id="newName" placeholder="اسم جديد">
    <button id="addBtn">إضافة</button>
  </div>
  <div id="list"></div>
  
</main>

<div class="modal" id="loginModal"><div class="box">
  <h2>دخول كأدمن</h2>
  <input type="password" id="pass" placeholder="كلمة السر">
  <div class="err" id="err"></div>
  <button id="loginGo">دخول</button>
  <button id="loginCancel" style="background:#999">إلغاء</button>
</div></div>

<div class="modal" id="recModal"><div class="box">
  <h2 id="recTitle"></h2>
  <ul id="recList"></ul>
  <button id="recClose">إغلاق</button>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== إعدادات =====
const ADMIN_PASS = "312012";
// لو عايز البيانات تتشارك بين كل الأجهزة: حط إعدادات Firebase هنا (Firestore)
const FIREBASE_CONFIG = null; // مثال: {apiKey:"...",authDomain:"...",projectId:"..."}
// ===================

const DEFAULT_NAMES = ["ماركو جورج","مينا إسحاق","يوساب ناجح","بيشوي ميلاد","كاراس ايهاب","كيرلس منتصر","جانو جرجس","كيرلس رأفت","شنودة روماني","بولا هاني","كاراس صديق"];
let state = {members: DEFAULT_NAMES.map((n,i)=>({id:"m"+(i+1),name:n})), records:{}};
let isAdmin = sessionStorage.getItem("adm")==="1";
let ref = null;
const $ = id => document.getElementById(id);
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
let day = today();

function save(){
  try{ localStorage.setItem("att_state", JSON.stringify(state)); }catch(e){}
  if(ref) ref.set(state).catch(()=>{});
}
function load(){
  try{ const s=localStorage.getItem("att_state"); if(s) state=JSON.parse(s); }catch(e){}
  if(FIREBASE_CONFIG && window.firebase){
    firebase.initializeApp(FIREBASE_CONFIG);
    ref = firebase.firestore().collection("attendance").doc("data");
    ref.onSnapshot(s=>{ if(s.exists){ state=s.data(); state.records=state.records||{}; render(); } else { ref.set(state); } });
  }
}
function absences(id){
  return Object.keys(state.records).filter(d=>state.records[d][id]==="a").sort().reverse();
}
function lastStatus(id){
  const ds=Object.keys(state.records).filter(d=>state.records[d][id]).sort();
  return ds.length ? state.records[ds[ds.length-1]][id] : null;
}
function setStatus(id,v){
  if(!isAdmin) return;
  state.records[day] = state.records[day]||{};
  state.records[day][id] = state.records[day][id]===v ? undefined : v;
  if(state.records[day][id]===undefined) delete state.records[day][id];
  save(); render();
}
function render(){
  $("adminBtn").textContent = isAdmin ? "خروج الأدمن" : "دخول كأدمن";
  $("addBox").hidden = !isAdmin;
  $("date").value = day;
  $("date").disabled = !isAdmin;
  $("dayLabel").textContent = new Date(day+"T00:00").toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const rec = state.records[day]||{};
  $("list").innerHTML = "";
  state.members.forEach(m=>{
    const st = rec[m.id], n = absences(m.id).length;
    const row = document.createElement("div"); row.className="row";
    row.innerHTML = '<div class="av"></div><div class="name"></div><div class="btns"></div>';
    row.querySelector(".av").textContent = m.name.trim().charAt(0);
    row.querySelector(".av").hidden = !isAdmin;
    const nm = row.querySelector(".name");
    nm.innerHTML = '<span></span>'+(isAdmin?'<small>غياب: '+n+'</small>':'');
    nm.firstChild.textContent = m.name;
    nm.onclick = () => showRecord(m);
    const b = row.querySelector(".btns"); if(isAdmin) b.classList.add("adm");
    const rb=document.createElement("button"); rb.textContent="السجل"; rb.onclick=()=>showRecord(m); b.appendChild(rb);
    if(isAdmin){
      [["p","حضر"],["a","غايب"]].forEach(([v,t])=>{
        const x=document.createElement("button"); x.textContent=t;
        if(st===v) x.className="on "+v;
        x.onclick=()=>setStatus(m.id,v); b.appendChild(x);
      });
      const d=document.createElement("button"); d.className="del"; d.textContent="🗑";
      d.onclick=()=>{ if(isAdmin && confirm("حذف "+m.name+"؟")){ state.members=state.members.filter(z=>z.id!==m.id); save(); render(); } };
      b.appendChild(d);
    } else {
      const ls=lastStatus(m.id), s=document.createElement("span");
      s.className="badge "+(ls||"n"); s.classList.add("circ"); s.textContent = ls==="p"?"✓":ls==="a"?"✗":"";
      b.appendChild(s);
    }
    $("list").appendChild(row);
  });
}
function showRecord(m){
  $("recTitle").textContent = "سجل: "+m.name;
  const ds = Object.keys(state.records).filter(d=>state.records[d][m.id]).sort().reverse();
  const pc = ds.filter(d=>state.records[d][m.id]==="p").length, ac = ds.length-pc;
  const ul=$("recList"); ul.innerHTML="";
  const sum=document.createElement("li"); sum.style.fontWeight="700";
  sum.textContent = "حضر: "+pc+"  |  غاب: "+ac; ul.appendChild(sum);
  if(!ds.length){ const li=document.createElement("li"); li.textContent="لا يوجد سجل بعد"; ul.appendChild(li); }
  ds.forEach(d=>{
    const ok = state.records[d][m.id]==="p", li=document.createElement("li");
    li.style.display="flex"; li.style.justifyContent="space-between";
    const t=document.createElement("span"); t.textContent=new Date(d+"T00:00").toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
    const r=document.createElement("b"); r.textContent = ok?"✓ حضر":"✗ غايب"; r.style.color = ok?"#4ade80":"#f87171";
    li.appendChild(t); li.appendChild(r); ul.appendChild(li);
  });
  $("recModal").classList.add("show");
}
$("recClose").onclick=()=>$("recModal").classList.remove("show");
$("adminBtn").onclick=()=>{
  if(isAdmin){ isAdmin=false; sessionStorage.removeItem("adm"); render(); }
  else { $("pass").value=""; $("err").textContent=""; $("loginModal").classList.add("show"); $("pass").focus(); }
};
$("loginCancel").onclick=()=>$("loginModal").classList.remove("show");
function tryLogin(){
  if($("pass").value===ADMIN_PASS){ isAdmin=true; sessionStorage.setItem("adm","1"); $("loginModal").classList.remove("show"); render(); }
  else $("err").textContent="كلمة السر غلط";
}
$("loginGo").onclick=tryLogin;
$("pass").addEventListener("keydown",e=>{ if(e.key==="Enter") tryLogin(); });
$("addBtn").onclick=()=>{
  if(!isAdmin) return;
  const v=$("newName").value.trim(); if(!v) return;
  state.members.push({id:"m"+Date.now(),name:v}); $("newName").value=""; save(); render();
};
$("date").onchange=e=>{ day=e.target.value||today(); render(); };
load(); render();
</script>
</body>
</html>
